<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffffff">
  <title>응급 지원 페이지 · 응급안심</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>
  <!-- 아이콘 정의 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-phone" viewBox="0 0 24 24"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.4 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 16.5 3C19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5z"/></symbol>
      <symbol id="i-aed" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.4 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 16.5 3C19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5z"/><path fill="#fff" d="M12.9 6.5 9 12.6h2.6l-.9 4.9 4.3-6.6h-2.7z"/></symbol>
      <symbol id="i-pulse" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M3 12h4l2-4 3 8 2-5 1.5 1H21"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M20 12H5m6-6-6 6 6 6"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4.4 0-8 2.2-8 5v1.5c0 .3.2.5.5.5h15c.3 0 .5-.2.5-.5V19c0-2.8-3.6-5-8-5z"/></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path fill="currentColor" d="M10.3 3.9a2 2 0 0 1 3.4 0l8.2 14.2A2 2 0 0 1 20.2 21H3.8a2 2 0 0 1-1.7-2.9zM11 9v5h2V9zm0 7v2h2v-2z"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><path fill="currentColor" d="M17 9V7A5 5 0 0 0 7 7v2a2 2 0 0 0-2 2v9c0 1.1.9 2 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2zM9 7a3 3 0 0 1 6 0v2H9zm4 9.7V18h-2v-1.3a2 2 0 1 1 2 0z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></symbol>
    </defs>
  </svg>

  <main class="page" id="app" aria-live="polite">

    <!-- 메인 (WEB-01) -->
    <section class="view" id="view-main" hidden>
      <header class="hero">
        <div class="hero-logo" aria-hidden="true">
          <svg><use href="#i-heart"/></svg>
          <svg class="hero-pulse"><use href="#i-pulse"/></svg>
        </div>
        <h1>응급 지원 페이지</h1>
        <p>이 사용자의 응급정보와<br>도움이 필요한 상황을 확인할 수 있습니다.</p>
      </header>

      <a class="btn-119" href="tel:119">
        <svg class="btn-119-icon" aria-hidden="true"><use href="#i-phone"/></svg>
        <span><strong>119에 신고하기</strong><small>(응급상황 발생 시)</small></span>
      </a>

      <nav class="menu" aria-label="응급 지원 메뉴">
        <button type="button" class="menu-item" id="btn-contact">
          <svg class="menu-icon" aria-hidden="true"><use href="#i-phone"/></svg>
          <span class="menu-label">비상연락망에 연락하기</span>
          <svg class="menu-chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
        </button>
        <a class="menu-item" href="#info">
          <svg class="menu-icon" aria-hidden="true"><use href="#i-heart"/></svg>
          <span class="menu-label">사용자 응급정보 확인</span>
          <svg class="menu-chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
        </a>
        <a class="menu-item" href="#aed">
          <svg class="menu-icon" aria-hidden="true"><use href="#i-aed"/></svg>
          <span class="menu-label">주변 AED 찾기</span>
          <svg class="menu-chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
        </a>
      </nav>

      <div class="notice" id="contact-result" hidden></div>

      <p class="footnote">
        <svg aria-hidden="true"><use href="#i-warn"/></svg>
        해당 정보는 응급상황 대응을 위한 최소한의 정보만 제공됩니다.
      </p>
    </section>

    <!-- 사용자 응급정보 (WEB-03) -->
    <section class="view" id="view-info" hidden>
      <header class="topbar">
        <a class="topbar-back" href="#" aria-label="뒤로"><svg><use href="#i-back"/></svg></a>
        <h1>사용자 응급정보</h1>
      </header>
      <div id="info-cards"></div>
      <div class="access" id="access-panel" hidden></div>
    </section>

    <!-- 주변 AED (WEB-06) -->
    <section class="view" id="view-aed" hidden>
      <header class="topbar">
        <a class="topbar-back" href="#" aria-label="뒤로"><svg><use href="#i-back"/></svg></a>
        <h1>주변 AED 찾기</h1>
      </header>
      <div class="chips" role="tablist" aria-label="정렬">
        <button type="button" class="chip is-active" data-aed-mode="near" role="tab" aria-selected="true">
          <svg aria-hidden="true"><use href="#i-pin"/></svg>가까운 순
        </button>
        <button type="button" class="chip" data-aed-mode="all" role="tab" aria-selected="false">전체 보기</button>
      </div>
      <div class="aed-map" id="aed-map" aria-hidden="true"></div>
      <div id="aed-body"></div>
    </section>

    <!-- 없는 태그 / 비활성 태그 -->
    <section class="view" id="view-error" hidden>
      <header class="hero">
        <div class="hero-logo hero-logo--muted" aria-hidden="true">
          <svg><use href="#i-heart"/></svg>
          <svg class="hero-pulse"><use href="#i-pulse"/></svg>
        </div>
        <h1 id="error-title"></h1>
        <p id="error-desc"></p>
      </header>
      <a class="btn-119" href="tel:119">
        <svg class="btn-119-icon" aria-hidden="true"><use href="#i-phone"/></svg>
        <span><strong>119에 신고하기</strong><small>(응급상황 발생 시)</small></span>
      </a>
    </section>

    <div class="loading" id="view-loading" role="status">불러오는 중…</div>
  </main>

  <!-- 비상연락망 연락 확인 (WEB-02) -->
  <dialog class="sheet" id="contact-dialog" aria-labelledby="contact-dialog-title">
    <form method="dialog">
      <div class="sheet-icon" aria-hidden="true"><svg><use href="#i-phone"/></svg></div>
      <h2 id="contact-dialog-title">비상연락망에 알릴까요?</h2>
      <p id="contact-dialog-desc"></p>
      <div class="sheet-actions">
        <button class="btn btn-ghost" value="cancel">취소</button>
        <button class="btn btn-primary" value="confirm">알리기</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/js/tag-page.js"></script>
</body>
</html>
