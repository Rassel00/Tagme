<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <!-- URL 에 승인 토큰이 있으므로 지도 링크 등으로 나갈 때 주소를 넘기지 않는다 -->
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffffff">
  <title>보호자 확인 · 응급안심</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css">
</head>
<body class="is-sub">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-phone" viewBox="0 0 24 24"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.4 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 16.5 3C19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5z"/></symbol>
      <symbol id="i-pulse" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M3 12h4l2-4 3 8 2-5 1.5 1H21"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path fill="currentColor" d="M10.3 3.9a2 2 0 0 1 3.4 0l8.2 14.2A2 2 0 0 1 20.2 21H3.8a2 2 0 0 1-1.7-2.9zM11 9v5h2V9zm0 7v2h2v-2z"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><path fill="currentColor" d="M17 9V7A5 5 0 0 0 7 7v2a2 2 0 0 0-2 2v9c0 1.1.9 2 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2zM9 7a3 3 0 0 1 6 0v2H9zm4 9.7V18h-2v-1.3a2 2 0 1 1 2 0z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4.4 0-8 2.2-8 5v1.5c0 .3.2.5.5.5h15c.3 0 .5-.2.5-.5V19c0-2.8-3.6-5-8-5z"/></symbol>
    </defs>
  </svg>

  <main class="page" aria-live="polite">
    <section class="view" id="view-main" hidden>
      <header class="hero hero--compact">
        <div class="hero-logo" aria-hidden="true">
          <svg><use href="#i-heart"/></svg>
          <svg class="hero-pulse"><use href="#i-pulse"/></svg>
        </div>
        <h1 id="title"></h1>
        <p id="subtitle"></p>
      </header>

      <!-- 신고 정보 (GRD-01) -->
      <section class="card" aria-labelledby="alert-card-title">
        <h2 class="card-title" id="alert-card-title"><svg aria-hidden="true"><use href="#i-warn"/></svg>신고 정보</h2>
        <dl class="field"><dt>신고 시각</dt><dd id="alert-time"></dd></dl>
        <dl class="field"><dt>위치</dt><dd id="alert-location"></dd></dl>
        <dl class="field"><dt>신고자 번호</dt><dd id="alert-rescuer"></dd></dl>
        <dl class="field"><dt>응급정보 열람</dt><dd id="alert-request"></dd></dl>
      </section>

      <!-- 신고자에게 전화 (GRD-02) -->
      <a class="btn btn-call btn-block" id="btn-call-rescuer" hidden>
        <svg aria-hidden="true"><use href="#i-phone"/></svg><span></span>
      </a>
      <a class="btn btn-ghost btn-block btn-119-sub" href="tel:119">
        <svg aria-hidden="true"><use href="#i-phone"/></svg>119에 신고하기
      </a>

      <!-- 승인·거절 (GRD-03) -->
      <section class="card decision" id="decision" aria-labelledby="decision-title"></section>

      <p class="footnote">
        <svg aria-hidden="true"><use href="#i-lock"/></svg>
        승인하면 이 신고를 한 사람의 화면에서만, 정한 시간 동안 응급정보가 보입니다. 링크는 신고 후 24시간 동안 유효합니다.
      </p>
    </section>

    <!-- 잘못된·만료된 링크 (GRD-04) -->
    <section class="view" id="view-error" hidden>
      <header class="hero">
        <div class="hero-logo hero-logo--muted" aria-hidden="true">
          <svg><use href="#i-heart"/></svg>
          <svg class="hero-pulse"><use href="#i-pulse"/></svg>
        </div>
        <h1 id="error-title"></h1>
        <p id="error-desc"></p>
      </header>
    </section>

    <div class="loading" id="view-loading" role="status">불러오는 중…</div>
  </main>

  <!-- 승인 확인 -->
  <dialog class="sheet" id="approve-dialog" aria-labelledby="approve-dialog-title">
    <form method="dialog">
      <div class="sheet-icon sheet-icon--green" aria-hidden="true"><svg><use href="#i-check"/></svg></div>
      <h2 id="approve-dialog-title">응급정보를 공개할까요?</h2>
      <p id="approve-dialog-desc"></p>
      <div class="sheet-actions">
        <button class="btn btn-ghost" value="cancel">취소</button>
        <button class="btn btn-primary" value="confirm">공개 승인</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/js/approval-page.js"></script>
</body>
</html>
